[project]
name = "emsinsight"
version = "0.1.0"
description = "EMS analytics on NEMSIS data — documentation quality, demand forecasting, pre-arrival risk"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyter>=1.0", "matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
